# Builds and tests every push and pull request.
# On main, a version in gradle.properties that has no GitHub release yet is released automatically:
# bump `version=` and push to publish a new release with the Fabric and NeoForge jars.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Read versions
        id: props
        run: |
          echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ESMAnchorShare-${{ steps.props.outputs.version }}
          path: |
            fabric/build/libs/ESMAnchorShare-Fabric-${{ steps.props.outputs.minecraft }}-${{ steps.props.outputs.version }}.jar
            neoforge/build/libs/ESMAnchorShare-NeoForge-${{ steps.props.outputs.minecraft }}-${{ steps.props.outputs.version }}.jar
          if-no-files-found: error

      - name: Release new version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.props.outputs.version }}
          MINECRAFT: ${{ steps.props.outputs.minecraft }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released, nothing to do"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "ESM Anchor Share $VERSION for Minecraft $MINECRAFT" \
            --generate-notes \
            "fabric/build/libs/ESMAnchorShare-Fabric-$MINECRAFT-$VERSION.jar" \
            "neoforge/build/libs/ESMAnchorShare-NeoForge-$MINECRAFT-$VERSION.jar"
